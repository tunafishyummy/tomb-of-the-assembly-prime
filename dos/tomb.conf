# DOSBox settings for Tomb of the Mask - DOS edition
# Works with DOSBox 0.74-3, DOSBox Staging and DOSBox-X.
[sdl]
fullscreen=false
windowresolution=1280x800

[cpu]
# IMPORTANT: DOSBox's default is a fixed, very slow CPU speed. The game needs "max".
cycles=max

[render]
aspect=true

[speaker]
pcspeaker=true

[sblaster]
sbtype=sb16
oplmode=auto

[autoexec]
mount c .
c:
TOMB.COM
exit
